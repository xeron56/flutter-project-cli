name: flutter_bloc_app_template
description: Empty Flutter BLoC app template with flavors, routing, DI, networking, localization, and theme foundations.

publish_to: 'none'

version: 1.0.0+1

environment:
 sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0

  # Routing
  go_router: ^14.6.2

  # Forms
  formz: ^0.7.0

  # Functional error handling
  dartz: ^0.10.1

  # Networking
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  http: ^1.4.0
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5

  # Storage
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  file: ^7.0.0

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Logging
  logger: ^2.5.0
  talker: ^5.0.0
  talker_logger: ^5.0.0
  talker_dio_logger: ^5.0.0
  talker_bloc_logger: ^5.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  animations: ^2.0.7
  gap: ^3.0.1

  # Localization
  intl: ^0.20.2
  intl_utils: ^2.8.10

  # Misc utilities
  nullx: ^0.1.17
  yaml: ^3.1.2
  collection: ^1.18.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  provider: ^6.1.5

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.15
  retrofit_generator: ^10.0.1
  injectable_generator: ^2.7.0
  flutter_gen_runner: ^5.9.0
  json_serializable: ^6.9.4
  freezed: ^3.0.2
  mockito: ^5.4.5
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  network_image_mock: ^2.1.1
  flutter_oss_licenses: ^3.0.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/icons/navigation/
    - google_fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: google_fonts/Roboto-Medium.ttf
          weight: 500

flutter_gen:
  output: lib/generated/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true

  colors:
    inputs:
      - assets/color/colors.xml

flutter_intl:
  enabled: true
